<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" fill="none">
  <defs>
    <radialGradient id="rcBgWash" cx="50%" cy="54%" r="44%">
      <stop offset="0%" stop-color="#F6E5BE" stop-opacity="0.62"/>
      <stop offset="56%" stop-color="#E5F1E6" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#FFFDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rcLeafA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9FC584"/>
      <stop offset="100%" stop-color="#5F9260"/>
    </linearGradient>
    <linearGradient id="rcLeafB" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BED797"/>
      <stop offset="100%" stop-color="#79AA6E"/>
    </linearGradient>
    <linearGradient id="rcCalPaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#F7F0DF"/>
    </linearGradient>
    <linearGradient id="rcCalTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F6DFAD"/>
      <stop offset="100%" stop-color="#EBBF66"/>
    </linearGradient>
    <linearGradient id="rcClockRim" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#F4CA74"/>
      <stop offset="100%" stop-color="#CC8E24"/>
    </linearGradient>
    <filter id="rcSoft" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Soft ambient gold & sage watercolor wash -->
  <ellipse cx="182" cy="134" rx="146" ry="86" fill="url(#rcBgWash)" filter="url(#rcSoft)"/>

  <!-- Left eucalyptus sprig -->
  <g opacity="0.9">
    <path d="M110 176 C88 150 76 112 80 72" stroke="#6E9968" stroke-width="1.9" stroke-linecap="round"/>
    <path d="M97 156 C72 152 57 140 59 129 C74 129 90 140 97 156 Z" fill="url(#rcLeafB)"/>
    <path d="M88 128 C64 118 52 102 58 91 C74 96 84 111 88 128 Z" fill="url(#rcLeafA)"/>
    <path d="M84 99 C67 87 62 71 71 62 C83 71 86 85 84 99 Z" fill="url(#rcLeafB)"/>
    <path d="M104 166 C87 174 71 174 66 165 C79 158 93 160 104 166 Z" fill="url(#rcLeafA)" opacity="0.82"/>
  </g>

  <!-- Right botanical leaves -->
  <g opacity="0.88">
    <path d="M254 176 C276 150 288 114 282 78" stroke="#6D9867" stroke-width="1.9" stroke-linecap="round"/>
    <path d="M268 152 C292 146 306 134 303 123 C288 125 275 136 268 152 Z" fill="url(#rcLeafA)"/>
    <path d="M277 123 C300 113 309 97 302 87 C287 92 280 107 277 123 Z" fill="url(#rcLeafB)"/>
    <path d="M277 95 C292 84 296 70 288 63 C277 71 275 83 277 95 Z" fill="url(#rcLeafA)" opacity="0.84"/>
  </g>

  <!-- Standing desk calendar -->
  <g transform="translate(106, 44) rotate(-4)">
    <!-- Back easel shadow -->
    <path d="M16 124 L132 124 L138 134 L10 134 Z" fill="#D5D2C2" opacity="0.62"/>
    <!-- Main calendar board -->
    <rect x="6" y="12" width="132" height="114" rx="11" fill="url(#rcCalPaper)" stroke="#C6B99B" stroke-width="1.6"/>
    <!-- Warm gold top band -->
    <path d="M6 23 C6 16.9 10.9 12 17 12 H127 C133.1 12 138 16.9 138 23 V35 H6 V23 Z" fill="url(#rcCalTop)"/>
    <!-- Top ring spirals -->
    <g stroke="#8E7952" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M26 5 C24 10 24 15 26 20"/>
      <path d="M46 5 C44 10 44 15 46 20"/>
      <path d="M66 5 C64 10 64 15 66 20"/>
      <path d="M86 5 C84 10 84 15 86 20"/>
      <path d="M106 5 C104 10 104 15 106 20"/>
      <path d="M122 5 C120 10 120 15 122 20"/>
    </g>
    <!-- Calendar day grid (4 rows x 5 cols) -->
    <g stroke="#DCD4BF" stroke-width="1">
      <rect x="20" y="46" width="16" height="12" rx="2.5" fill="#FBF8EF"/>
      <rect x="42" y="46" width="16" height="12" rx="2.5" fill="#FBF8EF"/>
      <rect x="64" y="46" width="16" height="12" rx="2.5" fill="#FBF8EF"/>
      <rect x="86" y="46" width="16" height="12" rx="2.5" fill="#FBF8EF"/>
      <rect x="108" y="46" width="16" height="12" rx="2.5" fill="#F5ECD7"/>

      <rect x="20" y="65" width="16" height="12" rx="2.5" fill="#FBF8EF"/>
      <rect x="42" y="65" width="16" height="12" rx="2.5" fill="#E3F2EA" stroke="#85BAA8"/>
      <rect x="64" y="65" width="16" height="12" rx="2.5" fill="#FBF8EF"/>
      <rect x="86" y="65" width="16" height="12" rx="2.5" fill="#FBF8EF"/>
      <rect x="108" y="65" width="16" height="12" rx="2.5" fill="#FBF8EF"/>

      <rect x="20" y="84" width="16" height="12" rx="2.5" fill="#FBF8EF"/>
      <rect x="42" y="84" width="16" height="12" rx="2.5" fill="#FBF8EF"/>
      <rect x="64" y="84" width="16" height="12" rx="2.5" fill="#FBF8EF"/>
      <rect x="86" y="84" width="16" height="12" rx="2.5" fill="#F5ECD7"/>
      <rect x="108" y="84" width="16" height="12" rx="2.5" fill="#FBF8EF"/>

      <rect x="20" y="103" width="16" height="12" rx="2.5" fill="#FBF8EF"/>
      <rect x="42" y="103" width="16" height="12" rx="2.5" fill="#FBF8EF"/>
      <rect x="64" y="103" width="16" height="12" rx="2.5" fill="#FBF8EF"/>
      <rect x="86" y="103" width="16" height="12" rx="2.5" fill="#FBF8EF"/>
    </g>
  </g>

  <!-- Golden bedside clock in lower right -->
  <g transform="translate(184, 96)">
    <!-- Soft shadow -->
    <ellipse cx="46" cy="96" rx="34" ry="7" fill="#D4D2C4" opacity="0.6"/>
    <!-- Twin alarm bells -->
    <path d="M12 20 C16 8 28 6 33 15 Z" fill="url(#rcClockRim)" stroke="#9C6A1A" stroke-width="1.3"/>
    <path d="M80 20 C76 8 64 6 59 15 Z" fill="url(#rcClockRim)" stroke="#9C6A1A" stroke-width="1.3"/>
    <line x1="46" y1="8" x2="46" y2="16" stroke="#9C6A1A" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="46" cy="7" r="3" fill="#E3B151" stroke="#9C6A1A" stroke-width="1.2"/>
    <!-- Clock feet -->
    <line x1="22" y1="83" x2="16" y2="93" stroke="#9C6A1A" stroke-width="3" stroke-linecap="round"/>
    <line x1="70" y1="83" x2="76" y2="93" stroke="#9C6A1A" stroke-width="3" stroke-linecap="round"/>
    <!-- Outer golden case -->
    <circle cx="46" cy="52" r="38" fill="url(#rcClockRim)" stroke="#9C6A1A" stroke-width="1.6"/>
    <!-- Cream dial face -->
    <circle cx="46" cy="52" r="30.5" fill="#FFFDF6" stroke="#E5D5AE" stroke-width="1.2"/>
    <!-- Hour ticks -->
    <g stroke="#9D8357" stroke-width="1.6" stroke-linecap="round">
      <line x1="46" y1="26" x2="46" y2="30"/>
      <line x1="46" y1="74" x2="46" y2="78"/>
      <line x1="20" y1="52" x2="24" y2="52"/>
      <line x1="68" y1="52" x2="72" y2="52"/>
    </g>
    <!-- Clock hands pointing cleanly ~9:05 -->
    <line x1="46" y1="52" x2="31" y2="44" stroke="#103B32" stroke-width="2.8" stroke-linecap="round"/>
    <line x1="46" y1="52" x2="57" y2="35" stroke="#087466" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="46" cy="52" r="3.4" fill="#EBAA24" stroke="#103B32" stroke-width="1.2"/>
  </g>
</svg>
