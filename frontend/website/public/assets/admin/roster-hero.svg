<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220" fill="none">
  <defs>
    <radialGradient id="rosterWash" cx="52%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#E6F4EC" stop-opacity="0.72"/>
      <stop offset="65%" stop-color="#F7F1E2" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#FEFBF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="clipboardWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFC87E"/>
      <stop offset="100%" stop-color="#DFAD58"/>
    </linearGradient>
    <linearGradient id="calendarTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A8268"/>
      <stop offset="100%" stop-color="#1E9E81"/>
    </linearGradient>
    <linearGradient id="leafLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#88BD7C"/>
      <stop offset="100%" stop-color="#589461"/>
    </linearGradient>
    <linearGradient id="leafRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A6CE8B"/>
      <stop offset="100%" stop-color="#69A56D"/>
    </linearGradient>
  </defs>

  <ellipse cx="184" cy="116" rx="158" ry="86" fill="url(#rosterWash)"/>

  <!-- Left botanical spray -->
  <g opacity="0.9">
    <path d="M98 168 C78 136, 70 96, 82 54" stroke="#5F9462" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M84 142 C60 132, 46 116, 48 104 C62 106, 78 122, 84 142 Z" fill="url(#leafLeft)"/>
    <path d="M77 114 C52 102, 40 84, 46 72 C62 78, 72 96, 77 114 Z" fill="url(#leafRight)"/>
    <path d="M78 86 C60 72, 54 54, 62 44 C76 54, 80 72, 78 86 Z" fill="url(#leafLeft)"/>
    <path d="M92 152 C74 156, 62 152, 58 142 C70 138, 82 142, 92 152 Z" fill="url(#leafRight)" opacity="0.82"/>
  </g>

  <!-- Right botanical spray -->
  <g opacity="0.88">
    <path d="M276 168 C294 140, 304 106, 294 68" stroke="#669969" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M286 146 C308 136, 322 122, 318 110 C304 112, 292 126, 286 146 Z" fill="url(#leafRight)"/>
    <path d="M294 116 C318 104, 326 88, 318 78 C304 84, 298 100, 294 116 Z" fill="url(#leafLeft)"/>
    <path d="M280 162 C298 166, 310 160, 314 150 C302 146, 290 152, 280 162 Z" fill="url(#leafRight)" opacity="0.8"/>
  </g>

  <!-- Gold-trimmed medical clipboard -->
  <g transform="translate(86, 36) rotate(-5)">
    <rect x="0" y="10" width="110" height="142" rx="12" fill="url(#clipboardWood)" stroke="#BA8838" stroke-width="1.5"/>
    <rect x="9" y="20" width="92" height="122" rx="7" fill="#FFFDF7" stroke="#E8DFCE" stroke-width="1"/>
    <!-- Clip -->
    <rect x="34" y="2" width="42" height="16" rx="5" fill="#9BBCAE" stroke="#5F8D7D" stroke-width="1.4"/>
    <circle cx="55" cy="7" r="3" fill="#FFFDF7"/>
    <!-- Checklist rows -->
    <rect x="20" y="40" width="14" height="14" rx="3.5" fill="#E3F5EB" stroke="#088469" stroke-width="1.3"/>
    <path d="M23 47 L26 50 L31 43" stroke="#088469" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="42" y="45" width="44" height="4" rx="2" fill="#D4DED8"/>

    <rect x="20" y="64" width="14" height="14" rx="3.5" fill="#E3F5EB" stroke="#088469" stroke-width="1.3"/>
    <path d="M23 71 L26 74 L31 67" stroke="#088469" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="42" y="69" width="38" height="4" rx="2" fill="#D4DED8"/>

    <rect x="20" y="88" width="14" height="14" rx="3.5" fill="#E3F5EB" stroke="#088469" stroke-width="1.3"/>
    <path d="M23 95 L26 98 L31 91" stroke="#088469" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="42" y="93" width="46" height="4" rx="2" fill="#D4DED8"/>

    <rect x="20" y="112" width="14" height="14" rx="3.5" fill="#F9EFE0" stroke="#D99B38" stroke-width="1.3"/>
    <rect x="42" y="117" width="34" height="4" rx="2" fill="#E2DBD0"/>
  </g>

  <!-- Mint desk shift calendar -->
  <g transform="translate(166, 62)">
    <rect x="4" y="10" width="112" height="106" rx="13" fill="#FFFDF9" stroke="#C6DAD0" stroke-width="1.6"/>
    <path d="M4 23 C4 15.8 9.8 10 17 10 H103 C110.2 10 116 15.8 116 23 V35 H4 V23 Z" fill="url(#calendarTop)"/>
    <!-- Binding rings -->
    <rect x="24" y="2" width="8" height="16" rx="4" fill="#F6FBF8" stroke="#066550" stroke-width="1.6"/>
    <rect x="56" y="2" width="8" height="16" rx="4" fill="#F6FBF8" stroke="#066550" stroke-width="1.6"/>
    <rect x="88" y="2" width="8" height="16" rx="4" fill="#F6FBF8" stroke="#066550" stroke-width="1.6"/>
    <!-- Grid cells -->
    <rect x="16" y="48" width="16" height="14" rx="3.5" fill="#EAF5EE"/>
    <rect x="38" y="48" width="16" height="14" rx="3.5" fill="#EAF5EE"/>
    <rect x="60" y="48" width="16" height="14" rx="3.5" fill="#D4EDE0"/>
    <rect x="82" y="48" width="16" height="14" rx="3.5" fill="#EAF5EE"/>

    <rect x="16" y="68" width="16" height="14" rx="3.5" fill="#D4EDE0"/>
    <rect x="38" y="68" width="16" height="14" rx="3.5" fill="#0B8268"/>
    <rect x="60" y="68" width="16" height="14" rx="3.5" fill="#EAF5EE"/>
    <rect x="82" y="68" width="16" height="14" rx="3.5" fill="#FAEAD0"/>

    <rect x="16" y="88" width="16" height="14" rx="3.5" fill="#EAF5EE"/>
    <rect x="38" y="88" width="16" height="14" rx="3.5" fill="#EAF5EE"/>
    <rect x="60" y="88" width="16" height="14" rx="3.5" fill="#D4EDE0"/>
    <rect x="82" y="88" width="16" height="14" rx="3.5" fill="#EAF5EE"/>
  </g>

  <!-- Coiled stethoscope overlay -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M266 56 C276 54, 286 62, 286 84 C286 108, 274 126, 260 126 C244 126, 232 108, 234 84 C235 66, 244 56, 252 56" stroke="#22685B" stroke-width="3.6" fill="none"/>
    <circle cx="266" cy="56" r="3.5" fill="#174D43"/>
    <circle cx="252" cy="56" r="3.5" fill="#174D43"/>
    <path d="M260 126 C258 158, 232 174, 206 168" stroke="#22685B" stroke-width="3.8" fill="none"/>
    <circle cx="204" cy="166" r="11" fill="#F2F7F4" stroke="#22685B" stroke-width="2.5"/>
    <circle cx="204" cy="166" r="5" fill="#0A8268"/>
  </g>
</svg>
