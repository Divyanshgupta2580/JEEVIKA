<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220" fill="none">
  <defs>
    <radialGradient id="swarmWash" cx="50%" cy="54%" r="48%">
      <stop offset="0%" stop-color="#E3F4EB" stop-opacity="0.78"/>
      <stop offset="70%" stop-color="#F7F1E2" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#FEFBF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screenMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFFAF4"/>
      <stop offset="100%" stop-color="#DDF2E7"/>
    </linearGradient>
    <linearGradient id="amberBottle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E89E38"/>
      <stop offset="100%" stop-color="#B86B1A"/>
    </linearGradient>
    <linearGradient id="swarmLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8BC17F"/>
      <stop offset="100%" stop-color="#58935F"/>
    </linearGradient>
  </defs>

  <ellipse cx="180" cy="118" rx="156" ry="82" fill="url(#swarmWash)"/>

  <!-- Left botanical foliage -->
  <g opacity="0.9">
    <path d="M84 166 C66 138, 60 100, 72 64" stroke="#5B8F5E" stroke-width="2.1" stroke-linecap="round"/>
    <path d="M72 142 C48 130, 36 114, 42 102 C56 106, 68 122, 72 142 Z" fill="url(#swarmLeaf)"/>
    <path d="M68 112 C46 100, 38 82, 46 72 C60 80, 66 96, 68 112 Z" fill="url(#swarmLeaf)" opacity="0.85"/>
    <path d="M80 156 C62 158, 50 154, 46 144 C58 140, 70 144, 80 156 Z" fill="url(#swarmLeaf)" opacity="0.75"/>
  </g>

  <!-- Right botanical foliage -->
  <g opacity="0.9">
    <path d="M276 166 C296 136, 304 98, 294 64" stroke="#5B8F5E" stroke-width="2.1" stroke-linecap="round"/>
    <path d="M286 144 C310 132, 322 116, 316 104 C302 108, 292 124, 286 144 Z" fill="url(#swarmLeaf)"/>
    <path d="M294 114 C318 102, 326 84, 318 74 C304 82, 298 98, 294 114 Z" fill="url(#swarmLeaf)" opacity="0.84"/>
  </g>

  <!-- Clinical tablet/laptop chassis -->
  <g>
    <rect x="116" y="48" width="136" height="100" rx="11" fill="#46695D" stroke="#2D4A40" stroke-width="1.6"/>
    <rect x="124" y="56" width="120" height="84" rx="6" fill="url(#screenMint)"/>
    <!-- ECG Pulse Wave -->
    <path d="M132 98 H156 L166 80 L176 116 L186 72 L198 112 L206 94 L214 98 H236" stroke="#047C61" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Base -->
    <path d="M102 150 H266 C266 158, 260 163, 250 163 H118 C108 163, 102 158, 102 150 Z" fill="#C4DAD0" stroke="#7EA495" stroke-width="1.3"/>
    <rect x="166" y="150" width="36" height="4" rx="2" fill="#8FB4A5"/>
  </g>

  <!-- Small amber medicine bottle -->
  <g transform="translate(82, 86)">
    <rect x="11" y="2" width="22" height="11" rx="3" fill="#B58958" stroke="#7D5A34" stroke-width="1.2"/>
    <rect x="4" y="13" width="36" height="58" rx="9" fill="url(#amberBottle)" stroke="#925210" stroke-width="1.3"/>
    <rect x="7" y="26" width="30" height="28" rx="3" fill="#FFFDF7" stroke="#E4D7C0" stroke-width="1"/>
    <path d="M22 33 V47 M15 40 H29" stroke="#0B8268" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Coiled stethoscope draping gently on right -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M276 46 C290 48, 298 62, 294 86 C290 108, 274 122, 260 116 C248 110, 246 88, 252 66 C256 50, 264 46, 270 46" stroke="#22685B" stroke-width="3.4" fill="none"/>
    <path d="M266 118 C268 148, 254 166, 232 162" stroke="#22685B" stroke-width="3.4" fill="none"/>
    <circle cx="228" cy="161" r="10.5" fill="#F2F7F4" stroke="#22685B" stroke-width="2.4"/>
    <circle cx="228" cy="161" r="4.5" fill="#047C61"/>
  </g>
</svg>
